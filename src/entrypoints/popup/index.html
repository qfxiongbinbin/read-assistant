<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>readAssistant</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        width: 296px;
        margin: 0;
        padding: 12px;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #1b2432;
        background: #fff;
      }
      header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
      h1 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.02em; }
      header .grow { flex: 1; }
      .field { margin-bottom: 10px; }
      .field > label { display: block; margin-bottom: 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: #5b6b82; }
      select, input[type='password'], input[type='text'] {
        width: 100%; padding: 6px 8px; border: 1px solid #d3dae4; border-radius: 6px;
        font: inherit; background: #fff; color: inherit;
      }
      select:focus, input:focus { outline: none; border-color: #2d6edc; }
      .row { display: flex; align-items: center; gap: 6px; }
      .row input { margin: 0; }
      .row label { font-size: 12.5px; color: #1b2432; }
      .switch { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #5b6b82; }
      footer { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
      button {
        padding: 6px 12px; border: 0; border-radius: 6px; background: #2d6edc; color: #fff;
        font: inherit; font-weight: 600; cursor: pointer;
      }
      button:disabled { opacity: 0.55; cursor: default; }
      #status { font-size: 12px; color: #5b6b82; }
      #status.error { color: #b3261e; }
      .hint { margin: 0 0 10px; font-size: 11.5px; color: #6b7a91; }
    </style>
  </head>
  <body>
    <header>
      <h1>readAssistant</h1>
      <span class="grow"></span>
      <label class="switch"><input id="enabled" type="checkbox" /> On</label>
    </header>

    <p class="hint">
      Click a paragraph to read it in simpler English. Select a word or a short phrase to get it said again with
      simpler words. Select a sentence to get a simple rewrite plus its key words and phrases. Everything stays
      in English.
    </p>

    <div class="field">
      <label for="level">Reading level</label>
      <select id="level">
        <option value="A2">A2 &mdash; very simple</option>
        <option value="B1">B1 &mdash; simple</option>
        <option value="B2">B2 &mdash; moderate</option>
      </select>
    </div>

    <div class="field">
      <label for="panelMode">Where to show it</label>
      <select id="panelMode">
        <option value="below">Below the paragraph</option>
        <option value="side">Beside the paragraph</option>
        <option value="float">Follow the cursor</option>
      </select>
    </div>

    <div class="field row">
      <input id="autoTranslate" type="checkbox" />
      <label for="autoTranslate">Translate words as soon as I select them</label>
    </div>

    <div class="field">
      <label for="accent">Pronunciation</label>
      <select id="accent">
        <option value="uk">British &mdash; en-GB</option>
        <option value="us">American &mdash; en-US</option>
      </select>
    </div>

    <div class="field row">
      <input id="phonetics" type="checkbox" />
      <label for="phonetics">Show phonetics above every word</label>
    </div>

    <div class="field">
      <label for="model">Model</label>
      <select id="model">
        <option value="deepseek-chat">deepseek-chat (recommended)</option>
        <option value="deepseek-reasoner">deepseek-reasoner</option>
      </select>
    </div>

    <div class="field">
      <label for="apiKey">DeepSeek API key</label>
      <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false" />
    </div>

    <div class="field row">
      <input id="siteOff" type="checkbox" />
      <label id="siteLabel" for="siteOff">Disable on this site</label>
    </div>

    <footer>
      <button id="save" type="button">Save</button>
      <span id="status"></span>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
